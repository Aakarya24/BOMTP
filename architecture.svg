<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" style="background: transparent;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="18" font-weight="500" fill="#1a1a1a">eBOM → mBOM Transformation Architecture</text>

  <!-- eBOM Database Box -->
  <rect x="40" y="70" width="180" height="140" rx="8" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="13" font-weight="500" fill="#1a1a1a">eBOM Database</text>
  <text x="130" y="115" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">SQLite | 16 parts</text>

  <rect x="55" y="130" width="150" height="18" rx="3" fill="#e5e7eb"/>
  <text x="65" y="143" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">ASM-MOTOR-MOUNT-001</text>
  <rect x="55" y="152" width="150" height="18" rx="3" fill="#e5e7eb"/>
  <text x="65" y="165" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">HARNESS-ASM-001</text>
  <rect x="55" y="174" width="150" height="18" rx="3" fill="#e5e7eb"/>
  <text x="65" y="187" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">+ 14 more parts...</text>

  <!-- Arrow: eBOM → Engine -->
  <line x1="220" y1="140" x2="300" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transformation Engine Box -->
  <rect x="310" y="60" width="260" height="160" rx="10" fill="#f0f7ff" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="85" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="14" font-weight="500" fill="#1e40af">Transformation Engine</text>
  <text x="440" y="102" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">Priority-ordered rule evaluation</text>

  <!-- Rule boxes inside engine -->
  <rect x="325" y="115" width="70" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="360" y="130" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#b91c1c">EXCLUDE</text>

  <rect x="405" y="115" width="70" height="22" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="440" y="130" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#1e40af">SPLIT</text>

  <rect x="485" y="115" width="70" height="22" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="520" y="130" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#6b21a8">MERGE</text>

  <rect x="325" y="145" width="70" height="22" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="360" y="160" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#15803d">ADD</text>

  <rect x="405" y="145" width="70" height="22" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
  <text x="440" y="160" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#c2410c">REQUANTIFY</text>

  <rect x="485" y="145" width="70" height="22" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="520" y="160" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">PASS-THRU</text>

  <text x="440" y="190" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#6b7280">First-match wins | Full audit per decision</text>

  <!-- Rule Registry (side) -->
  <rect x="340" y="210" width="200" height="50" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="440" y="230" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="11" font-weight="500" fill="#854d0e">Rule Registry</text>
  <text x="440" y="248" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#a16207">6 active rules | Configurable via API</text>

  <!-- Arrow: Engine → mBOM -->
  <line x1="570" y1="140" x2="650" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mBOM Database Box -->
  <rect x="660" y="70" width="180" height="140" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="750" y="95" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="13" font-weight="500" fill="#1a1a1a">mBOM Database</text>
  <text x="750" y="115" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">SQLite | 18 lines</text>

  <rect x="675" y="130" width="150" height="18" rx="3" fill="#dcfce7"/>
  <text x="685" y="143" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#166534">KIT-FASTENER-M3-001</text>
  <rect x="675" y="152" width="150" height="18" rx="3" fill="#dcfce7"/>
  <text x="685" y="165" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#166534">THERMAL-PASTE-001</text>
  <rect x="675" y="174" width="150" height="18" rx="3" fill="#dcfce7"/>
  <text x="685" y="187" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#166534">+ 16 more lines...</text>

  <!-- Audit Trail Box (below) -->
  <rect x="310" y="280" width="260" height="80" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="440" y="305" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="13" font-weight="500" fill="#1a1a1a">Audit Trail</text>
  <text x="440" y="322" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">8 entries | Before/after state | Justification</text>
  <text x="440" y="342" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#a855f7">Every decision logged: who, what, when, why</text>

  <!-- Arrows to audit -->
  <line x1="130" y1="210" x2="380" y2="280" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <line x1="440" y1="220" x2="440" y2="280" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <line x1="750" y1="210" x2="500" y2="280" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Validation Layer Box -->
  <rect x="310" y="380" width="260" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="405" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="13" font-weight="500" fill="#1a1a1a">Validation Layer</text>
  <text x="440" y="422" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">UOM check | Build sequence | Orphan check | Unmapped flag</text>
  <text x="440" y="442" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#d97706">0 errors | 9 warnings (unmapped parts for review)</text>

  <!-- Arrow: mBOM → Validation -->
  <line x1="750" y1="210" x2="750" y2="420" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="420" x2="570" y2="420" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="40" y="380" width="180" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="405" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="13" font-weight="500" fill="#1a1a1a">FastAPI REST API</text>
  <text x="130" y="422" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#6b7280">POST /transform | GET /audit</text>
  <text x="130" y="442" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#3b82f6">GET /mbom | GET /validation</text>

  <!-- Arrow: API → Engine -->
  <line x1="220" y1="420" x2="310" y2="420" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <!-- Legend -->
  <rect x="660" y="280" width="200" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="760" y="300" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="11" font-weight="500" fill="#374151">Legend</text>

  <rect x="675" y="315" width="12" height="12" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="695" y="325" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Exclude (drop virtual)</text>

  <rect x="675" y="335" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="695" y="345" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Split (1→N)</text>

  <rect x="675" y="355" width="12" height="12" rx="2" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="695" y="365" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Merge (N→1)</text>

  <rect x="675" y="375" width="12" height="12" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="695" y="385" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Add (inject items)</text>

  <rect x="675" y="395" width="12" height="12" rx="2" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
  <text x="695" y="405" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Requantify (adjust qty)</text>

  <rect x="675" y="415" width="12" height="12" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="695" y="425" font-family="var(--kimi-font-sans, sans-serif)" font-size="9" fill="#4b5563">Pass-through (default)</text>

  <!-- Bottom note -->
  <text x="450" y="490" text-anchor="middle" font-family="var(--kimi-font-sans, sans-serif)" font-size="10" fill="#9ca3af">Python 3.12 | SQLite | FastAPI | Priority-ordered rule engine | Full audit trail | Validation layer</text>
</svg>